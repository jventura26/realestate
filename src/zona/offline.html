<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin conexión | Zona INNmueble</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0D1B3E;
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
.wrap{max-width:420px}
.logo{font-family:'Georgia',serif;font-size:20px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-bottom:32px}
.logo em{font-style:normal;color:#F5820D}
h1{font-size:22px;font-weight:600;margin-bottom:12px}
p{color:#8A9BB0;font-size:14px;line-height:1.7;margin-bottom:28px}
button{
  background:#F5820D;
  color:#0D1B3E;
  border:none;
  padding:12px 28px;
  border-radius:8px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}
button:hover{opacity:.9}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Zona <em>INNmueble</em></div>
    <h1>Sin conexión a internet</h1>
    <p>No pudimos cargar esta página porque no hay conexión disponible en este momento. Las propiedades, precios y disponibilidad necesitan conexión para mostrarse siempre actualizados.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
